name: 인스타그램 게시

on:
  schedule:
    # 매일 08:53 KST (23:53 UTC). GitHub 예약 실행은 몇 분 늦게 시작되는 일이 많아 9시 전후에 올라가도록 앞당겨 둠
    - cron: "53 23 * * *"
  workflow_dispatch:
    inputs:
      code:
        description: "게시물 코드 (예: V1111). 비우면 오늘 날짜 게시물"
        required: false
        default: ""
      mode:
        description: "check = 점검만(게시 안 함), post = 실제 게시"
        required: true
        default: "check"
        type: choice
        options: [check, post]

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841478285216963"
          MODE: ${{ github.event.inputs.mode || 'post' }}
          CODE: ${{ github.event.inputs.code || '' }}
        run: python3 post.py
      - name: 게시 기록 저장
        if: success()
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "terrasse-bot"
            git config user.email "terrasse-bot@users.noreply.github.com"
            git add posted.json
            git commit -m "게시 기록: $(date -u -d '+9 hours' +%F)"
            git push
          fi
